<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Passé C." />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#ffffff" />
  <title>Le Passé Composé — Être ou Avoir</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%); min-height: 100vh; min-height: 100dvh; }
    #app { padding: max(env(safe-area-inset-top, 16px), 16px) max(env(safe-area-inset-right, 16px), 16px) max(env(safe-area-inset-bottom, 16px), 16px) max(env(safe-area-inset-left, 16px), 16px); min-height: 100vh; }
    .container { max-width: 720px; margin: 0 auto; }
  </style>
</head>
<body>
  <div id="app"></div>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ============================================================================
    // CARD DATA
    // ============================================================================
    const CARDS = [
      // === ÊTRE VERBS (Fill-in-the-blank) ===
      { type: "fill", sentence: "Elle ______ \u00e0 Paris hier.", answer: "est all\u00e9e", infinitive: "aller", agreement: "f.s.", en: "She went to Paris yesterday.", cat: "\u00catre Verbs" },
      { type: "fill", sentence: "Nous ______ \u00e0 huit heures.", answer: "sommes partis", infinitive: "partir", agreement: "m.pl.", en: "We left at eight o'clock.", cat: "\u00catre Verbs" },
      { type: "fill", sentence: "Ils ______ du train.", answer: "sont descendus", infinitive: "descendre", agreement: "m.pl.", en: "They got off the train.", cat: "\u00catre Verbs" },
      { type: "fill", sentence: "Je ______ m\u00e9decin.", answer: "suis devenu", infinitive: "devenir", agreement: "m.s.", en: "I became a doctor.", cat: "\u00catre Verbs" },
      { type: "fill", sentence: "Elles ______ l'ann\u00e9e derni\u00e8re.", answer: "sont n\u00e9es", infinitive: "na\u00eetre", agreement: "f.pl.", en: "They were born last year.", cat: "\u00catre Verbs" },
      { type: "fill", sentence: "Il ______ \u00e0 minuit.", answer: "est arriv\u00e9", infinitive: "arriver", agreement: "m.s.", en: "He arrived at midnight.", cat: "\u00catre Verbs" },
      { type: "fill", sentence: "Elles ______ tard ce soir.", answer: "sont rentr\u00e9es", infinitive: "rentrer", agreement: "f.pl.", en: "They came back home late tonight.", cat: "\u00catre Verbs" },
      { type: "fill", sentence: "Tu ______ au premier \u00e9tage.", answer: "es mont\u00e9", infinitive: "monter", agreement: "m.s.", en: "You went up to the first floor.", cat: "\u00catre Verbs" },
      { type: "fill", sentence: "Il ______ pendant la guerre.", answer: "est mort", infinitive: "mourir", agreement: "m.s.", en: "He died during the war.", cat: "\u00catre Verbs" },
      { type: "fill", sentence: "Elles ______ au cin\u00e9ma samedi.", answer: "sont all\u00e9es", infinitive: "aller", agreement: "f.pl.", en: "They went to the cinema on Saturday.", cat: "\u00catre Verbs" },
      { type: "fill", sentence: "Vous ______ t\u00f4t le matin.", answer: "\u00eates venus", infinitive: "venir", agreement: "m.pl.", en: "You came early in the morning.", cat: "\u00catre Verbs" },
      { type: "fill", sentence: "Elle ______ longtemps ici.", answer: "est rest\u00e9e", infinitive: "rester", agreement: "f.s.", en: "She stayed here for a long time.", cat: "\u00catre Verbs" },

      // === REFLEXIVE VERBS ===
      { type: "fill", sentence: "Elle ______ t\u00f4t ce matin.", answer: "s'est lev\u00e9e", infinitive: "se lever", agreement: "f.s.", en: "She got up early this morning.", cat: "Reflexive Verbs" },
      { type: "fill", sentence: "Nous ______ dans le parc.", answer: "nous sommes promen\u00e9s", infinitive: "se promener", agreement: "m.pl.", en: "We took a walk in the park.", cat: "Reflexive Verbs" },
      { type: "fill", sentence: "Ils ______ avant le d\u00eener.", answer: "se sont lav\u00e9s", infinitive: "se laver", agreement: "m.pl.", en: "They washed themselves before dinner.", cat: "Reflexive Verbs" },
      { type: "fill", sentence: "Je ______ hier soir.", answer: "me suis couch\u00e9", infinitive: "se coucher", agreement: "m.s.", en: "I went to bed last night.", cat: "Reflexive Verbs" },
      { type: "fill", sentence: "Vous ______ \u00e0 huit heures.", answer: "vous \u00eates r\u00e9veill\u00e9s", infinitive: "se r\u00e9veiller", agreement: "m.pl.", en: "You woke up at eight o'clock.", cat: "Reflexive Verbs" },
      { type: "fill", sentence: "Elle ______ avec son fr\u00e8re.", answer: "s'est disput\u00e9e", infinitive: "se disputer", agreement: "f.s.", en: "She argued with her brother.", cat: "Reflexive Verbs" },

      // === AVOIR VERBS ===
      { type: "fill", sentence: "J'______ un bon film.", answer: "ai regard\u00e9", infinitive: "regarder", en: "I watched a good movie.", cat: "Avoir Verbs" },
      { type: "fill", sentence: "Nous ______ au restaurant.", answer: "avons mang\u00e9", infinitive: "manger", en: "We ate at the restaurant.", cat: "Avoir Verbs" },
      { type: "fill", sentence: "Elle ______ ses amies hier.", answer: "a invit\u00e9", infinitive: "inviter", en: "She invited her friends yesterday.", cat: "Avoir Verbs" },
      { type: "fill", sentence: "Ils ______ beaucoup de plaisir.", answer: "ont eu", infinitive: "avoir", en: "They had a lot of fun.", cat: "Avoir Verbs" },
      { type: "fill", sentence: "Tu ______ tes devoirs?", answer: "as fini", infinitive: "finir", en: "Did you finish your homework?", cat: "Avoir Verbs" },
      { type: "fill", sentence: "Vous ______ \u00e0 la question.", answer: "avez r\u00e9pondu", infinitive: "r\u00e9pondre", en: "You answered the question.", cat: "Avoir Verbs" },
      { type: "fill", sentence: "J'______ le livre ce mois-ci.", answer: "ai lu", infinitive: "lire", en: "I read the book this month.", cat: "Avoir Verbs" },
      { type: "fill", sentence: "Elle ______ une belle robe.", answer: "a achet\u00e9", infinitive: "acheter", en: "She bought a beautiful dress.", cat: "Avoir Verbs" },

      // === REGULAR -ER → -É ===
      { type: "fill", sentence: "Elle ______ une pomme.", answer: "a mang\u00e9", infinitive: "manger", hint: "-er \u2192 -\u00e9", en: "She ate an apple.", cat: "Regular -er \u2192 -\u00e9" },
      { type: "fill", sentence: "Nous ______ la t\u00e9l\u00e9vision.", answer: "avons regard\u00e9", infinitive: "regarder", hint: "-er \u2192 -\u00e9", en: "We watched television.", cat: "Regular -er \u2192 -\u00e9" },
      { type: "fill", sentence: "Ils ______ au football.", answer: "ont jou\u00e9", infinitive: "jouer", hint: "-er \u2192 -\u00e9", en: "They played football.", cat: "Regular -er \u2192 -\u00e9" },
      { type: "fill", sentence: "J'______ avec mon ami.", answer: "ai parl\u00e9", infinitive: "parler", hint: "-er \u2192 -\u00e9", en: "I talked with my friend.", cat: "Regular -er \u2192 -\u00e9" },
      { type: "fill", sentence: "Vous ______ toute la nuit.", answer: "avez dans\u00e9", infinitive: "danser", hint: "-er \u2192 -\u00e9", en: "You danced all night.", cat: "Regular -er \u2192 -\u00e9" },
      { type: "fill", sentence: "Elle ______ une chanson.", answer: "a chant\u00e9", infinitive: "chanter", hint: "-er \u2192 -\u00e9", en: "She sang a song.", cat: "Regular -er \u2192 -\u00e9" },

      // === REGULAR -IR → -I ===
      { type: "fill", sentence: "J'______ mes devoirs.", answer: "ai fini", infinitive: "finir", hint: "-ir \u2192 -i", en: "I finished my homework.", cat: "Regular -ir \u2192 -i" },
      { type: "fill", sentence: "Ils ______ un cadeau.", answer: "ont choisi", infinitive: "choisir", hint: "-ir \u2192 -i", en: "They chose a gift.", cat: "Regular -ir \u2192 -i" },
      { type: "fill", sentence: "Elle ______ le formulaire.", answer: "a rempli", infinitive: "remplir", hint: "-ir \u2192 -i", en: "She filled out the form.", cat: "Regular -ir \u2192 -i" },
      { type: "fill", sentence: "Nous ______ \u00e0 six heures.", answer: "sommes partis", infinitive: "partir", agreement: "m.pl.", hint: "-ir \u2192 -i (\u00eatre verb!)", en: "We left at six o'clock.", cat: "Regular -ir \u2192 -i" },
      { type: "fill", sentence: "Vous ______ l'examen.", answer: "avez r\u00e9ussi", infinitive: "r\u00e9ussir", hint: "-ir \u2192 -i", en: "You passed the exam.", cat: "Regular -ir \u2192 -i" },
      { type: "fill", sentence: "Ils ______ longtemps.", answer: "ont dormi", infinitive: "dormir", hint: "-ir \u2192 -i", en: "They slept a long time.", cat: "Regular -ir \u2192 -i" },

      // === REGULAR -RE → -U ===
      { type: "fill", sentence: "Elle ______ sa maison.", answer: "a vendu", infinitive: "vendre", hint: "-re \u2192 -u", en: "She sold her house.", cat: "Regular -re \u2192 -u" },
      { type: "fill", sentence: "Nous ______ \u00e0 la lettre.", answer: "avons r\u00e9pondu", infinitive: "r\u00e9pondre", hint: "-re \u2192 -u", en: "We answered the letter.", cat: "Regular -re \u2192 -u" },
      { type: "fill", sentence: "Vous ______ le bruit?", answer: "avez entendu", infinitive: "entendre", hint: "-re \u2192 -u", en: "Did you hear the noise?", cat: "Regular -re \u2192 -u" },
      { type: "fill", sentence: "J'______ le bus.", answer: "ai attendu", infinitive: "attendre", hint: "-re \u2192 -u", en: "I waited for the bus.", cat: "Regular -re \u2192 -u" },
      { type: "fill", sentence: "Ils ______ leurs cl\u00e9s.", answer: "ont perdu", infinitive: "perdre", hint: "-re \u2192 -u", en: "They lost their keys.", cat: "Regular -re \u2192 -u" },
      { type: "fill", sentence: "Elle ______ son ami.", answer: "a d\u00e9fendu", infinitive: "d\u00e9fendre", hint: "-re \u2192 -u", en: "She defended her friend.", cat: "Regular -re \u2192 -u" },
    ];

    const CAT_COLORS = {
      "Être Verbs":       { bg: "rgb(254, 226, 226)", border: "rgb(239, 68, 68)", text: "rgb(185, 28, 28)" },
      "Reflexive Verbs":  { bg: "rgb(252, 231, 243)", border: "rgb(236, 72, 153)", text: "rgb(190, 24, 93)" },
      "Avoir Verbs":      { bg: "rgb(219, 234, 254)", border: "rgb(59, 130, 246)", text: "rgb(29, 78, 216)" },
      "Regular -er → -é": { bg: "rgb(220, 252, 231)", border: "rgb(34, 197, 94)", text: "rgb(21, 128, 61)" },
      "Regular -ir → -i": { bg: "rgb(243, 232, 255)", border: "rgb(168, 85, 247)", text: "rgb(126, 34, 206)" },
      "Regular -re → -u": { bg: "rgb(204, 251, 241)", border: "rgb(20, 184, 166)", text: "rgb(15, 118, 110)" },
    };

    // ============================================================================
    // UTILITY FUNCTIONS
    // ============================================================================
    function shuffle(arr) {
      let copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        let j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function speak(text, rate = 0.9) {
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = "fr-FR";
      utter.rate = rate;
      const voices = window.speechSynthesis.getVoices();
      const frVoice = voices.find(v => v.lang === "fr-FR" && v.name.includes("Thomas"))
        || voices.find(v => v.lang === "fr-FR" && v.name.includes("Amélie"))
        || voices.find(v => v.lang === "fr-FR" && !v.name.includes("Google"))
        || voices.find(v => v.lang.startsWith("fr"));
      if (frVoice) utter.voice = frVoice;
      window.speechSynthesis.speak(utter);
    }

    // Preload voices
    if (typeof window !== "undefined" && window.speechSynthesis) {
      window.speechSynthesis.getVoices();
      window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
    }

    // ============================================================================
    // SPEAKER BUTTON
    // ============================================================================
    function SpeakerBtn({ text, label = "", style = {} }) {
      return (
        <button
          onClick={() => speak(text)}
          title="Click to hear pronunciation"
          style={{
            background: "none",
            border: "1px solid #cbd5e1",
            borderRadius: 4,
            padding: "4px 8px",
            cursor: "pointer",
            display: "inline-flex",
            alignItems: "center",
            gap: 4,
            fontSize: 12,
            color: "#475569",
            transition: "all 0.2s",
            ...style,
          }}
          onMouseEnter={(e) => {
            e.currentTarget.style.borderColor = "#94a3b8";
            e.currentTarget.style.color = "#1e293b";
          }}
          onMouseLeave={(e) => {
            e.currentTarget.style.borderColor = "#cbd5e1";
            e.currentTarget.style.color = "#475569";
          }}
        >
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M15.54 8.46a6 6 0 0 1 0 8.07"></path>
          </svg>
          {label}
        </button>
      );
    }

    // ============================================================================
    // CARD COMPONENT
    // ============================================================================
    function Card({ card, isFlipped, onFlip }) {
      // FILL-IN-THE-BLANK CARD
      const colors = CAT_COLORS[card.cat] || CAT_COLORS["\u00catre Verbs"];
      const parts = card.sentence.split("______");
      const fullSentence = card.sentence.replace("______", card.answer);

      return (
        <div
          onClick={onFlip}
          style={{
            background: "white",
            borderRadius: 16,
            padding: 28,
            cursor: "pointer",
            minHeight: 320,
            display: "flex",
            flexDirection: "column",
            justifyContent: "space-between",
            boxShadow: "0 4px 24px rgba(0,0,0,0.08)",
            border: "2px solid #e2e8f0",
            transition: "all 0.2s",
          }}
        >
          <div>
            {/* INFINITIVE — prominent at top */}
            <div style={{ textAlign: "center", marginBottom: 20 }}>
              <span
                onClick={isFlipped ? undefined : (e) => { e.stopPropagation(); speak(card.infinitive, 0.75); }}
                style={{
                  fontSize: 28, fontWeight: 700, color: colors.text,
                  cursor: "pointer", borderBottom: "2px dotted " + colors.border,
                  paddingBottom: 2,
                }}
              >{card.infinitive}</span>
              {card.agreement && (
                <span style={{ fontSize: 13, color: "#94a3b8", marginLeft: 8 }}>({card.agreement})</span>
              )}
            </div>

            {/* SENTENCE WITH SINGLE BLANK */}
            <div style={{ fontSize: 18, color: "#1e293b", lineHeight: 1.8, fontWeight: 500, textAlign: "center" }}>
              {parts[0]}
              <span
                onClick={isFlipped ? (e) => { e.stopPropagation(); speak(card.answer, 0.75); } : undefined}
                style={{
                  display: "inline-block",
                  minWidth: isFlipped ? "auto" : 120,
                  padding: "4px 10px",
                  margin: "0 4px",
                  background: isFlipped ? colors.bg : "rgba(100, 116, 139, 0.06)",
                  color: isFlipped ? colors.text : "transparent",
                  borderBottom: isFlipped ? "2px dotted " + colors.border : "3px solid " + colors.border,
                  borderRadius: isFlipped ? 6 : 0,
                  fontWeight: 700,
                  fontSize: 18,
                  cursor: isFlipped ? "pointer" : "default",
                  transition: "all 0.3s",
                }}
              >
                {isFlipped ? card.answer : "\u00a0"}
              </span>
              {parts[1]}
            </div>

            {/* HINT (for regular participle cards) */}
            {!isFlipped && card.hint && (
              <div style={{ fontSize: 13, color: "#94a3b8", marginTop: 14, textAlign: "center", fontStyle: "italic" }}>
                {card.hint}
              </div>
            )}

            {/* PROMPT (when not flipped) */}
            {!isFlipped && !card.hint && (
              <div style={{ fontSize: 13, color: "#94a3b8", marginTop: 14, textAlign: "center" }}>
                être ou avoir? + participe passé
              </div>
            )}

            {/* ANSWER DETAILS (when flipped) */}
            {isFlipped && (
              <div style={{ marginTop: 16, paddingTop: 14, borderTop: "1px solid #e2e8f0" }}>
                <div style={{ fontSize: 14, color: "#64748b", fontStyle: "italic", textAlign: "center" }}>
                  {card.en}
                </div>
              </div>
            )}
          </div>

          {/* SPEAKER FOR FULL SENTENCE */}
          <div style={{ display: "flex", gap: 8, justifyContent: "center", marginTop: 16, alignItems: "center" }}>
            {isFlipped && (
              <SpeakerBtn text={fullSentence} label="Listen" />
            )}
            {!isFlipped && (
              <span style={{ fontSize: 12, color: "#cbd5e1" }}>Tap to reveal</span>
            )}
          </div>
        </div>
      );
    }

    // ============================================================================
    // MAIN APP
    // ============================================================================
    function App() {
      const [cards, setCards] = useState(() => shuffle(CARDS));
      const [currentIdx, setCurrentIdx] = useState(0);
      const [flipped, setFlipped] = useState(false);
      const [selectedCats, setSelectedCats] = useState(new Set(Object.keys(CAT_COLORS)));
      const [hideKnown, setHideKnown] = useState(false);
      const [knownCards, setKnownCards] = useState(new Set());
      const [isShuffle, setIsShuffle] = useState(false);

      const [touchStart, setTouchStart] = useState(null);
      const handleTouchStart = (e) => setTouchStart(e.touches[0].clientX);
      const handleTouchEnd = (e) => {
        if (touchStart === null) return;
        const diff = e.changedTouches[0].clientX - touchStart;
        if (Math.abs(diff) > 50) { diff > 0 ? prevCard() : nextCard(); }
        setTouchStart(null);
      };

      const filtered = cards.filter((c) => selectedCats.has(c.cat) && !(hideKnown && knownCards.has(c)));
      const current = filtered[currentIdx] || null;
      const progress = currentIdx + 1;
      const total = filtered.length;

      const toggleCategory = (cat) => {
        setSelectedCats((prev) => {
          const next = new Set(prev);
          if (next.has(cat)) next.delete(cat);
          else next.add(cat);
          return next;
        });
        setCurrentIdx(0);
        setFlipped(false);
      };

      const toggleKnown = () => {
        if (current) {
          setKnownCards((prev) => {
            const next = new Set(prev);
            if (next.has(current)) next.delete(current);
            else next.add(current);
            return next;
          });
        }
      };

      const nextCard = () => {
        if (currentIdx < filtered.length - 1) {
          setCurrentIdx(currentIdx + 1);
          setFlipped(false);
        }
      };

      const prevCard = () => {
        if (currentIdx > 0) {
          setCurrentIdx(currentIdx - 1);
          setFlipped(false);
        }
      };

      const shuffleCards = () => {
        setCards(shuffle(cards));
        setCurrentIdx(0);
        setFlipped(false);
      };

      const toggleShuffle = () => {
        if (!isShuffle) shuffleCards();
        setIsShuffle(!isShuffle);
      };

      useEffect(() => {
        const handleKey = (e) => {
          if (e.key === " ") {
            e.preventDefault();
            setFlipped(!flipped);
          } else if (e.key === "ArrowRight") nextCard();
          else if (e.key === "ArrowLeft") prevCard();
        };
        window.addEventListener("keydown", handleKey);
        return () => window.removeEventListener("keydown", handleKey);
      }, [flipped, currentIdx, filtered.length]);

      if (!current) {
        return (
          <div className="container" style={{ color: "#1e293b", textAlign: "center", paddingTop: 100 }}>
            <h2>No cards match your filters</h2>
            <p>Try selecting other categories</p>
          </div>
        );
      }

      return (
        <div className="container">
          {/* BACK TO INDEX LINK */}
          <div style={{ marginBottom: 20 }}>
            <a href="index.html" style={{ display: "inline-flex", alignItems: "center", gap: 4, fontSize: 13, color: "#64748b", textDecoration: "none", padding: "4px 0", marginBottom: 8 }}
              onMouseEnter={(e) => e.currentTarget.style.color = "#1e293b"}
              onMouseLeave={(e) => e.currentTarget.style.color = "#64748b"}
            >
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
              All decks
            </a>
          </div>

          {/* HEADER */}
          <div style={{ marginBottom: 24 }}>
            <h1 style={{ fontSize: 24, fontWeight: 700, color: "#1e293b", margin: 0, textAlign: "center" }}>
              Le Passé Composé
            </h1>
            <p style={{ color: "#64748b", fontSize: 14, marginTop: 4, textAlign: "center" }}>
              {CARDS.length} cards — être vs avoir &amp; regular participle formation
            </p>
          </div>

          {/* CATEGORY PILLS */}
          <div style={{ display: "flex", flexWrap: "wrap", gap: 8, justifyContent: "center", marginBottom: 24 }}>
            {Object.keys(CAT_COLORS).map((cat) => {
              const color = CAT_COLORS[cat];
              const isSelected = selectedCats.has(cat);
              return (
                <button
                  key={cat}
                  onClick={() => toggleCategory(cat)}
                  style={{
                    padding: "8px 14px",
                    borderRadius: 20,
                    border: `2px solid ${color.border}`,
                    background: isSelected ? color.bg : "white",
                    color: isSelected ? color.text : "#64748b",
                    fontSize: 12,
                    fontWeight: 600,
                    cursor: "pointer",
                    transition: "all 0.2s",
                  }}
                  onMouseEnter={(e) => {
                    if (!isSelected) e.currentTarget.style.background = "#f1f5f9";
                  }}
                  onMouseLeave={(e) => {
                    e.currentTarget.style.background = isSelected ? color.bg : "white";
                  }}
                >
                  {cat}
                </button>
              );
            })}
          </div>

          {/* CARD PROGRESS */}
          <div style={{ textAlign: "center", marginBottom: 20, color: "#64748b", fontSize: 13 }}>
            Card {progress} of {total}
          </div>

          {/* CARD */}
          <div style={{ marginBottom: 28 }} onTouchStart={handleTouchStart} onTouchEnd={handleTouchEnd}>
            {current && <Card card={current} isFlipped={flipped} onFlip={() => setFlipped(!flipped)} />}
          </div>

          {/* NAVIGATION */}
          <div style={{ display: "flex", justifyContent: "center", alignItems: "center", gap: 20, marginBottom: 16 }}>
            <button onClick={prevCard} disabled={currentIdx === 0}
              style={{ width: 44, height: 44, borderRadius: "50%", border: "2px solid #cbd5e1", background: "white", color: currentIdx === 0 ? "#cbd5e1" : "#475569", cursor: currentIdx === 0 ? "default" : "pointer", fontSize: 20, display: "flex", alignItems: "center", justifyContent: "center", transition: "all 0.2s" }}>
              ‹
            </button>
            <button onClick={() => setFlipped(!flipped)}
              style={{ padding: "8px 20px", borderRadius: 20, border: "2px solid #3b82f6", background: "#eff6ff", color: "#2563eb", cursor: "pointer", fontSize: 13, fontWeight: 600, transition: "all 0.2s" }}>
              {flipped ? "Show Question" : "Reveal"} (Space)
            </button>
            <button onClick={nextCard} disabled={currentIdx >= filtered.length - 1}
              style={{ width: 44, height: 44, borderRadius: "50%", border: "2px solid #cbd5e1", background: "white", color: currentIdx >= filtered.length - 1 ? "#cbd5e1" : "#475569", cursor: currentIdx >= filtered.length - 1 ? "default" : "pointer", fontSize: 20, display: "flex", alignItems: "center", justifyContent: "center", transition: "all 0.2s" }}>
              ›
            </button>
          </div>

          {/* SECONDARY CONTROLS */}
          <div style={{ display: "flex", gap: 8, justifyContent: "center", marginBottom: 40, flexWrap: "wrap" }}>
            <button onClick={toggleShuffle}
              style={{ padding: "6px 12px", borderRadius: 20, border: "2px solid", borderColor: isShuffle ? "#3b82f6" : "#cbd5e1", background: isShuffle ? "#eff6ff" : "white", color: isShuffle ? "#2563eb" : "#64748b", cursor: "pointer", fontSize: 12, fontWeight: 600, transition: "all 0.2s" }}>
              {isShuffle ? "Shuffled" : "Shuffle"}
            </button>
            <button onClick={toggleKnown}
              style={{ padding: "6px 12px", borderRadius: 20, border: "2px solid", borderColor: knownCards.has(current) ? "#22c55e" : "#cbd5e1", background: knownCards.has(current) ? "#dcfce7" : "white", color: knownCards.has(current) ? "#15803d" : "#64748b", cursor: "pointer", fontSize: 12, fontWeight: 600, transition: "all 0.2s" }}>
              {knownCards.has(current) ? "✓ Known" : "Mark Known"}
            </button>
            <button onClick={() => setHideKnown(!hideKnown)}
              style={{ padding: "6px 12px", borderRadius: 20, border: "2px solid", borderColor: hideKnown ? "#f59e0b" : "#cbd5e1", background: hideKnown ? "#fef3c7" : "white", color: hideKnown ? "#b45309" : "#64748b", cursor: "pointer", fontSize: 12, fontWeight: 600, transition: "all 0.2s" }}>
              {hideKnown ? "Showing Unknown" : "Hide Known"}
            </button>
          </div>
        </div>
      );
    }

    // ============================================================================
    // RENDER
    // ============================================================================
    ReactDOM.createRoot(document.getElementById("app")).render(<App />);
  </script>
</body>
</html>
