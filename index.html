<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="French Cards">
<meta name="theme-color" content="#1e293b">
<title>French Flash Cards</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
    min-height: 100vh; min-height: 100dvh;
    padding: 40px 20px;
  }
  .container { max-width: 600px; margin: 0 auto; }
  h1 { font-size: 32px; font-weight: 700; color: #1e293b; text-align: center; margin-bottom: 8px; }
  .subtitle { color: #64748b; font-size: 16px; text-align: center; margin-bottom: 40px; }
  .deck-list { display: flex; flex-direction: column; gap: 16px; }
  .deck-card {
    display: block; text-decoration: none;
    background: white; border-radius: 16px; padding: 24px;
    border: 2px solid #e2e8f0;
    box-shadow: 0 4px 16px rgba(0,0,0,0.06);
    transition: all 0.2s;
  }
  .deck-card:hover { border-color: #3b82f6; box-shadow: 0 8px 24px rgba(59,130,246,0.15); transform: translateY(-2px); }
  .deck-title { font-size: 20px; font-weight: 700; color: #1e293b; margin-bottom: 6px; }
  .deck-desc { font-size: 14px; color: #64748b; line-height: 1.5; }
  .deck-meta { margin-top: 12px; display: flex; gap: 12px; flex-wrap: wrap; }
  .deck-tag {
    font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 12px;
    background: #eff6ff; color: #2563eb;
  }
  .footer { text-align: center; margin-top: 48px; font-size: 13px; color: #94a3b8; }
</style>
</head>
<body>
<div class="container">
  <h1>French Flash Cards</h1>
  <p class="subtitle">Vocabulary decks for learning French</p>

  <div class="deck-list">
    <a href="french-flashcards-dailylife.html" class="deck-card">
      <div class="deck-title">La Vie Quotidienne</div>
      <div class="deck-desc">60 essential words and phrases for managing daily life — morning routines, meals, household chores, shopping, transport, and more.</div>
      <div class="deck-meta">
        <span class="deck-tag">60 cards</span>
        <span class="deck-tag">8 categories</span>
        <span class="deck-tag">Beginner–Intermediate</span>
      </div>
    </a>

    <!-- Add more decks here:
    <a href="french-flashcards-travel.html" class="deck-card">
      <div class="deck-title">Les Voyages</div>
      <div class="deck-desc">Description here.</div>
      <div class="deck-meta">
        <span class="deck-tag">X cards</span>
      </div>
    </a>
    -->
  </div>

  <p class="footer">Tap a deck to start studying</p>
</div>
</body>
</html>
