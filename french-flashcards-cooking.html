<!DOCTYPE html>

<title>Cuisiner à la Maison — French Cooking Flash Cards</title>
<style>

  body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%); min-height: 100vh; min-height: 100dvh; }

<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useMemo, useCallback, useEffect } = React;

const CARDS = [
  // Viandes et protéines
  { fr: "le poulet", en: "chicken", ex: "Je fais r\u00f4tir le poulet avec des herbes de Provence.", exEn: "I roast the chicken with herbs de Provence.", cat: "Meat & Protein" },
  { fr: "le b\u0153uf", en: "beef", ex: "Le b\u0153uf bourguignon mijote pendant trois heures.", exEn: "The beef bourguignon simmers for three hours.", cat: "Meat & Protein" },
  { fr: "le porc", en: "pork", ex: "On fait des c\u00f4tes de porc au barbecue ce soir.", exEn: "We're grilling pork chops on the barbecue tonight.", cat: "Meat & Protein" },
  { fr: "le poisson", en: "fish", ex: "Le poisson est meilleur quand il est tr\u00e8s frais.", exEn: "Fish is best when it's very fresh.", cat: "Meat & Protein" },
  { fr: "les crevettes", en: "shrimp", ex: "Je fais sauter les crevettes avec de l'ail.", exEn: "I saut\u00e9 the shrimp with garlic.", cat: "Meat & Protein" },
  { fr: "un \u0153uf", en: "an egg", ex: "Il faut casser les \u0153ufs dans un bol s\u00e9par\u00e9.", exEn: "You need to crack the eggs into a separate bowl.", cat: "Meat & Protein" },
  { fr: "le lard / le bacon", en: "bacon", ex: "Fais rissoler le lard avant d'ajouter les oignons.", exEn: "Brown the bacon before adding the onions.", cat: "Meat & Protein" },

  // Légumes et herbes
  { fr: "un oignon", en: "an onion", ex: "Fais revenir l'oignon jusqu'\u00e0 ce qu'il soit translucide.", exEn: "Cook the onion until it becomes translucent.", cat: "Vegetables & Herbs" },
  { fr: "l'ail", en: "garlic", ex: "Ajoute l'ail \u00e9minc\u00e9 et fais-le revenir une minute.", exEn: "Add the minced garlic and cook it for one minute.", cat: "Vegetables & Herbs" },
  { fr: "une carotte", en: "a carrot", ex: "Coupe les carottes en rondelles fines.", exEn: "Cut the carrots into thin rounds.", cat: "Vegetables & Herbs" },
  { fr: "une pomme de terre", en: "a potato", ex: "\u00c9pluche les pommes de terre et coupe-les en d\u00e9s.", exEn: "Peel the potatoes and cut them into cubes.", cat: "Vegetables & Herbs" },
  { fr: "une tomate", en: "a tomato", ex: "Enl\u00e8ve les graines des tomates avant de les couper.", exEn: "Remove the seeds from the tomatoes before cutting them.", cat: "Vegetables & Herbs" },
  { fr: "le persil", en: "parsley", ex: "Ajoute du persil frais juste avant de servir.", exEn: "Add fresh parsley just before serving.", cat: "Vegetables & Herbs" },
  { fr: "le thym", en: "thyme", ex: "Le thym va tr\u00e8s bien avec le poulet r\u00f4ti.", exEn: "Thyme goes very well with roast chicken.", cat: "Vegetables & Herbs" },
  { fr: "le basilic", en: "basil", ex: "D\u00e9chire le basilic \u00e0 la main plut\u00f4t que de le couper.", exEn: "Tear the basil by hand rather than cutting it.", cat: "Vegetables & Herbs" },

  { fr: "le beurre", en: "butter", ex: "Fais fondre le beurre \u00e0 feu doux dans la casserole.", exEn: "Melt the butter over low heat in the saucepan.", cat: "Pantry Basics" },
  { fr: "l'huile d'olive", en: "olive oil", ex: "Verse un filet d'huile d'olive dans la po\u00eale.", exEn: "Pour a drizzle of olive oil into the pan.", cat: "Pantry Basics" },
  { fr: "le sel", en: "salt", ex: "Assaisonne avec du sel et du poivre selon ton go\u00fbt.", exEn: "Season with salt and pepper to your taste.", cat: "Pantry Basics" },
  { fr: "le poivre", en: "pepper", ex: "Donne quelques tours de moulin \u00e0 poivre.", exEn: "Give a few turns of the pepper mill.", cat: "Pantry Basics" },
  { fr: "le sucre", en: "sugar", ex: "Ajoute une cuill\u00e8re \u00e0 soupe de sucre dans la p\u00e2te.", exEn: "Add a tablespoon of sugar to the batter.", cat: "Pantry Basics" },
  { fr: "la cr\u00e8me fra\u00eeche", en: "cr\u00e8me fra\u00eeche / sour cream", ex: "Incorpore la cr\u00e8me fra\u00eeche en fin de cuisson.", exEn: "Stir in the cr\u00e8me fra\u00eeche at the end of cooking.", cat: "Pantry Basics" },
  { fr: "le bouillon", en: "broth / stock", ex: "Ajoute le bouillon de poulet petit \u00e0 petit.", exEn: "Add the chicken broth little by little.", cat: "Pantry Basics" },

  // Ustensiles de cuisine
  { fr: "une casserole", en: "a saucepan", ex: "Fais chauffer l'eau dans une grande casserole.", exEn: "Heat the water in a large saucepan.", cat: "Kitchen Tools" },
  { fr: "une po\u00eale", en: "a frying pan / skillet", ex: "Fais chauffer la po\u00eale avant d'ajouter l'huile.", exEn: "Heat up the pan before adding the oil.", cat: "Kitchen Tools" },
  { fr: "un couteau", en: "a knife", ex: "Utilise un couteau bien aiguisé pour \u00e9mincer.", exEn: "Use a sharp knife for slicing.", cat: "Kitchen Tools" },
  { fr: "une planche \u00e0 d\u00e9couper", en: "a cutting board", ex: "Pose les l\u00e9gumes sur la planche \u00e0 d\u00e9couper.", exEn: "Place the vegetables on the cutting board.", cat: "Kitchen Tools" },
  { fr: "un fouet", en: "a whisk", ex: "Bats les \u0153ufs avec un fouet jusqu'\u00e0 ce qu'ils soient mousseux.", exEn: "Beat the eggs with a whisk until they're frothy.", cat: "Kitchen Tools" },
  { fr: "une spatule", en: "a spatula", ex: "Retourne les cr\u00eapes avec une spatule.", exEn: "Flip the cr\u00eapes with a spatula.", cat: "Kitchen Tools" },
  { fr: "une passoire", en: "a colander / strainer", ex: "\u00c9goutte les p\u00e2tes dans la passoire.", exEn: "Drain the pasta in the colander.", cat: "Kitchen Tools" },
  { fr: "un saladier", en: "a mixing bowl", ex: "M\u00e9lange tous les ingr\u00e9dients dans un grand saladier.", exEn: "Mix all the ingredients in a large bowl.", cat: "Kitchen Tools" },
  { fr: "le four", en: "the oven", ex: "Pr\u00e9chauffe le four \u00e0 cent quatre-vingts degr\u00e9s.", exEn: "Preheat the oven to one hundred eighty degrees.", cat: "Kitchen Tools" },
  { fr: "une cuill\u00e8re en bois", en: "a wooden spoon", ex: "Remue la sauce avec une cuill\u00e8re en bois.", exEn: "Stir the sauce with a wooden spoon.", cat: "Kitchen Tools" },

  // Verbes de cuisine
  { fr: "couper", en: "to cut / chop", ex: "Coupe les l\u00e9gumes en petits morceaux.", exEn: "Cut the vegetables into small pieces.", cat: "Cooking Verbs" },
  { fr: "\u00e9mincer", en: "to slice thinly / mince", ex: "\u00c9mince l'oignon le plus finement possible.", exEn: "Slice the onion as finely as possible.", cat: "Cooking Verbs" },
  { fr: "\u00e9plucher", en: "to peel", ex: "\u00c9pluche les pommes avant de les mettre dans la tarte.", exEn: "Peel the apples before putting them in the pie.", cat: "Cooking Verbs" },
  { fr: "m\u00e9langer", en: "to mix / stir", ex: "M\u00e9lange la farine et les \u0153ufs jusqu'\u00e0 obtenir une p\u00e2te lisse.", exEn: "Mix the flour and eggs until you get a smooth batter.", cat: "Cooking Verbs" },
  { fr: "faire revenir", en: "to saut\u00e9 / brown", ex: "Fais revenir les oignons dans un peu de beurre.", exEn: "Saut\u00e9 the onions in a little butter.", cat: "Cooking Verbs" },
  { fr: "faire bouillir", en: "to boil", ex: "Fais bouillir l'eau avant d'ajouter les p\u00e2tes.", exEn: "Boil the water before adding the pasta.", cat: "Cooking Verbs" },
  { fr: "mijoter", en: "to simmer", ex: "Laisse mijoter \u00e0 feu doux pendant une heure.", exEn: "Let it simmer on low heat for an hour.", cat: "Cooking Verbs" },
  { fr: "r\u00f4tir", en: "to roast", ex: "On va r\u00f4tir le poulet au four avec des pommes de terre.", exEn: "We're going to roast the chicken in the oven with potatoes.", cat: "Cooking Verbs" },
  { fr: "gratiner", en: "to bake until golden / gratin", ex: "Fais gratiner le dessus au four pendant dix minutes.", exEn: "Bake the top in the oven for ten minutes until golden.", cat: "Cooking Verbs" },
  { fr: "assaisonner", en: "to season", ex: "N'oublie pas d'assaisonner avant de servir.", exEn: "Don't forget to season before serving.", cat: "Cooking Verbs" },
  { fr: "verser", en: "to pour", ex: "Verse la sauce sur les p\u00e2tes et m\u00e9lange bien.", exEn: "Pour the sauce over the pasta and mix well.", cat: "Cooking Verbs" },
  { fr: "go\u00fcter", en: "to taste", ex: "Go\u00fbte la soupe et ajuste le sel si n\u00e9cessaire.", exEn: "Taste the soup and adjust the salt if needed.", cat: "Cooking Verbs" },

  // Termes de recette
  { fr: "une recette", en: "a recipe", ex: "J'ai trouv\u00e9 une nouvelle recette de gratin dauphinois.", exEn: "I found a new recipe for potatoes au gratin.", cat: "Recipe Terms" },
  { fr: "une cuill\u00e8re \u00e0 soupe", en: "a tablespoon", ex: "Ajoute deux cuill\u00e8res \u00e0 soupe de cr\u00e8me.", exEn: "Add two tablespoons of cream.", cat: "Recipe Terms" },
  { fr: "une cuill\u00e8re \u00e0 caf\u00e9", en: "a teaspoon", ex: "Mets une cuill\u00e8re \u00e0 caf\u00e9 de vanille.", exEn: "Add a teaspoon of vanilla.", cat: "Recipe Terms" },
  { fr: "une pinc\u00e9e", en: "a pinch", ex: "Ajoute une pinc\u00e9e de sel dans la p\u00e2te.", exEn: "Add a pinch of salt to the batter.", cat: "Recipe Terms" },
  { fr: "un filet", en: "a drizzle / splash", ex: "Termine avec un filet de jus de citron.", exEn: "Finish with a drizzle of lemon juice.", cat: "Recipe Terms" },
  { fr: "\u00e0 feu doux", en: "on low heat", ex: "Laisse cuire \u00e0 feu doux pendant vingt minutes.", exEn: "Let it cook on low heat for twenty minutes.", cat: "Recipe Terms" },
  { fr: "\u00e0 feu vif", en: "on high heat", ex: "Fais saisir la viande \u00e0 feu vif.", exEn: "Sear the meat on high heat.", cat: "Recipe Terms" },
  { fr: "laisser reposer", en: "to let rest", ex: "Laisse reposer la p\u00e2te au frigo pendant une heure.", exEn: "Let the dough rest in the fridge for an hour.", cat: "Recipe Terms" },

  // Goûts et textures
  { fr: "sal\u00e9", en: "salty", ex: "C'est un peu trop sal\u00e9, ajoute de l'eau.", exEn: "It's a bit too salty, add some water.", cat: "Taste & Texture" },
  { fr: "sucr\u00e9", en: "sweet", ex: "Ce dessert est sucr\u00e9 mais pas \u00e9c\u0153urant.", exEn: "This dessert is sweet but not sickly.", cat: "Taste & Texture" },
  { fr: "\u00e9pic\u00e9", en: "spicy", ex: "Si tu aimes les plats \u00e9pic\u00e9s, ajoute du piment.", exEn: "If you like spicy dishes, add some chili.", cat: "Taste & Texture" },
  { fr: "croustillant", en: "crispy / crunchy", ex: "Le poulet est bien croustillant \u00e0 l'ext\u00e9rieur.", exEn: "The chicken is nicely crispy on the outside.", cat: "Taste & Texture" },
  { fr: "moelleux", en: "soft / moist (cake)", ex: "Ce g\u00e2teau au chocolat est incroyablement moelleux.", exEn: "This chocolate cake is incredibly moist.", cat: "Taste & Texture" },
  { fr: "fondant", en: "melt-in-your-mouth", ex: "La viande est fondante apr\u00e8s trois heures de cuisson.", exEn: "The meat is melt-in-your-mouth after three hours of cooking.", cat: "Taste & Texture" },
  { fr: "d\u00e9licieux", en: "delicious", ex: "C'est vraiment d\u00e9licieux, tu peux me donner la recette ?", exEn: "It's really delicious, can you give me the recipe?", cat: "Taste & Texture" },
];

const CATEGORIES = [...new Set(CARDS.map(c => c.cat))];

const CAT_COLORS = {
  "Meat & Protein":     { bg: "rgb(254, 226, 226)", border: "rgb(239, 68, 68)",  text: "rgb(185, 28, 28)" },
  "Vegetables & Herbs": { bg: "rgb(220, 252, 231)", border: "rgb(34, 197, 94)",   text: "rgb(21, 128, 61)" },
  "Pantry Basics":      { bg: "rgb(254, 243, 199)", border: "rgb(245, 158, 11)", text: "rgb(180, 83, 9)" },
  "Kitchen Tools":      { bg: "rgb(219, 234, 254)", border: "rgb(59, 130, 246)",  text: "rgb(29, 78, 216)" },
  "Cooking Verbs":      { bg: "rgb(243, 232, 255)", border: "rgb(168, 85, 247)",  text: "rgb(126, 34, 206)" },
  "Recipe Terms":       { bg: "rgb(255, 237, 213)", border: "rgb(249, 115, 22)",  text: "rgb(194, 65, 12)" },
  "Taste & Texture":    { bg: "rgb(252, 231, 243)", border: "rgb(236, 72, 153)",  text: "rgb(190, 24, 93)" },
};

// Text-to-speech
function speak(text, rate = 0.9) {
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = "fr-FR";
  utter.rate = rate;
  const voices = window.speechSynthesis.getVoices();
  const frVoice = voices.find(v => v.lang === "fr-FR" && v.name.includes("Thomas"))
    || voices.find(v => v.lang === "fr-FR" && v.name.includes("Am\u00e9lie"))
    || voices.find(v => v.lang === "fr-FR" && !v.name.includes("Google"))
    || voices.find(v => v.lang.startsWith("fr"));
  if (frVoice) utter.voice = frVoice;
  window.speechSynthesis.speak(utter);
}

function SpeakerBtn({ text, rate, size = 18, color = "#64748b" }) {
  return (
    <button
      onClick={(e) => { e.stopPropagation(); speak(text, rate); }}
      aria-label="Listen"
      style={{
        background: "none", border: "none", cursor: "pointer", padding: 4,
        display: "inline-flex", alignItems: "center", justifyContent: "center",
        borderRadius: 6, transition: "background 0.2s", verticalAlign: "middle",
      }}
      onMouseEnter={(e) => e.currentTarget.style.background = "rgba(0,0,0,0.06)"}
      onMouseLeave={(e) => e.currentTarget.style.background = "none"}
    >
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
        <path d="M15.54 8.46a5 5 0 0 1 0 7.07" />
        <path d="M19.07 4.93a10 10 0 0 1 0 14.14" />
      </svg>
    </button>
  );
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

if (typeof window !== "undefined" && window.speechSynthesis) {
  window.speechSynthesis.getVoices();
  window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
}

function FlashCards() {
  const [activeCat, setActiveCat] = useState("All");
  const [flipped, setFlipped] = useState(false);
  const [index, setIndex] = useState(0);
  const [shuffled, setShuffled] = useState(false);
  const [known, setKnown] = useState(new Set());
  const [hideKnown, setHideKnown] = useState(false);
  const [showTranslation, setShowTranslation] = useState(false);

  const deck = useMemo(() => {
    let cards = activeCat === "All" ? CARDS : CARDS.filter(c => c.cat === activeCat);
    if (hideKnown) cards = cards.filter(c => !known.has(CARDS.indexOf(c)));
    return shuffled ? shuffle(cards) : cards;
  }, [activeCat, shuffled, hideKnown, known]);

  const safeIndex = Math.min(index, Math.max(0, deck.length - 1));
  const card = deck[safeIndex];
  const globalIdx = card ? CARDS.indexOf(card) : -1;

  const next = useCallback(() => { setFlipped(false); setShowTranslation(false); setIndex(i => Math.min(i + 1, deck.length - 1)); }, [deck.length]);
  const prev = useCallback(() => { setFlipped(false); setShowTranslation(false); setIndex(i => Math.max(i - 1, 0)); }, []);
  const toggleKnown = useCallback(() => {
    if (globalIdx < 0) return;
    setKnown(prev => {
      const s = new Set(prev);
      s.has(globalIdx) ? s.delete(globalIdx) : s.add(globalIdx);
      return s;
    });
  }, [globalIdx]);

  const colors = card ? CAT_COLORS[card.cat] : CAT_COLORS["Meat & Protein"];

  useEffect(() => {
    const handler = (e) => {
      if (e.key === "ArrowRight") next();
      else if (e.key === "ArrowLeft") prev();
      else if (e.key === " ") { e.preventDefault(); setFlipped(f => !f); }
    };
    window.addEventListener("keydown", handler);
    return () => window.removeEventListener("keydown", handler);
  }, [next, prev]);

  const [touchStart, setTouchStart] = useState(null);
  const handleTouchStart = (e) => setTouchStart(e.touches[0].clientX);
  const handleTouchEnd = (e) => {
    if (touchStart === null) return;
    const diff = e.changedTouches[0].clientX - touchStart;
    if (Math.abs(diff) > 50) { diff > 0 ? prev() : next(); }
    setTouchStart(null);
  };

  return (
    <div style={{ minHeight: "100vh", minHeight: "100dvh", background: "linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%)", fontFamily: "'Segoe UI', system-ui, -apple-system, sans-serif", padding: "max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom))", boxSizing: "border-box" }}>
      <div style={{ maxWidth: 720, margin: "0 auto" }}>
        <div style={{ marginBottom: 20 }}>
          <a href="index.html" style={{ display: "inline-flex", alignItems: "center", gap: 4, fontSize: 13, color: "#64748b", textDecoration: "none", padding: "4px 0", marginBottom: 8 }}
            onMouseEnter={(e) => e.currentTarget.style.color = "#1e293b"}
            onMouseLeave={(e) => e.currentTarget.style.color = "#64748b"}
          ><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>All decks</a>
          <h1 style={{ fontSize: 24, fontWeight: 700, color: "#1e293b", margin: 0, textAlign: "center" }}>
            Cuisiner à la Maison
          </h1>
          <p style={{ color: "#64748b", fontSize: 14, marginTop: 4, textAlign: "center" }}>
            {CARDS.length} words &amp; phrases for cooking at home in French
          </p>
        </div>

        <div style={{ display: "flex", flexWrap: "wrap", gap: 6, justifyContent: "center", marginBottom: 16 }}>
          <button
            onClick={() => { setActiveCat("All"); setIndex(0); setFlipped(false); setShowTranslation(false); }}
            style={{
              padding: "5px 12px", borderRadius: 20, border: "2px solid",
              borderColor: activeCat === "All" ? "#475569" : "#cbd5e1",
              background: activeCat === "All" ? "#475569" : "white",
              color: activeCat === "All" ? "white" : "#475569",
              fontSize: 12, fontWeight: 600, cursor: "pointer", transition: "all 0.2s"
            }}
          >All ({CARDS.length})</button>
          {CATEGORIES.map(cat => {
            const c = CAT_COLORS[cat];
            const count = CARDS.filter(x => x.cat === cat).length;
            return (
              <button key={cat}
                onClick={() => { setActiveCat(cat); setIndex(0); setFlipped(false); setShowTranslation(false); }}
                style={{
                  padding: "5px 12px", borderRadius: 20, border: "2px solid",
                  borderColor: activeCat === cat ? c.border : "#cbd5e1",
                  background: activeCat === cat ? c.bg : "white",
                  color: activeCat === cat ? c.text : "#64748b",
                  fontSize: 12, fontWeight: 600, cursor: "pointer", transition: "all 0.2s"
                }}
              >{cat} ({count})</button>
            );
          })}
        </div>

        <div style={{ display: "flex", justifyContent: "center", gap: 14, marginBottom: 16, flexWrap: "wrap" }}>
          <label style={{ display: "flex", alignItems: "center", gap: 5, fontSize: 13, color: "#475569", cursor: "pointer" }}>
            <input type="checkbox" checked={shuffled} onChange={() => { setShuffled(!shuffled); setIndex(0); setFlipped(false); }} />
            Shuffle
          </label>
          <label style={{ display: "flex", alignItems: "center", gap: 5, fontSize: 13, color: "#475569", cursor: "pointer" }}>
            <input type="checkbox" checked={hideKnown} onChange={() => { setHideKnown(!hideKnown); setIndex(0); setFlipped(false); }} />
            Hide known ({known.size})
          </label>
          {known.size > 0 && (
            <button onClick={() => setKnown(new Set())}
              style={{ fontSize: 12, color: "#ef4444", background: "none", border: "none", cursor: "pointer", textDecoration: "underline" }}>
              Reset
            </button>
          )}
        </div>

        {deck.length === 0 ? (
          <div style={{ textAlign: "center", padding: 60, color: "#64748b" }}>
            <p style={{ fontSize: 18 }}>You know all the cards in this category!</p>
            <button onClick={() => { setHideKnown(false); }}
              style={{ marginTop: 12, padding: "8px 20px", borderRadius: 8, border: "none", background: "#475569", color: "white", cursor: "pointer" }}>
              Show all cards
            </button>
          </div>
        ) : (
          <>
            <div style={{ height: 4, background: "#e2e8f0", borderRadius: 2, marginBottom: 12, overflow: "hidden" }}>
              <div style={{ height: "100%", width: `${((safeIndex + 1) / deck.length) * 100}%`, background: colors.border, borderRadius: 2, transition: "width 0.3s" }} />
            </div>

            <div style={{ textAlign: "center", marginBottom: 10, fontSize: 14, color: "#64748b" }}>
              {safeIndex + 1} / {deck.length}
              {card && <span style={{ marginLeft: 10, padding: "2px 8px", borderRadius: 12, background: colors.bg, color: colors.text, fontSize: 11, fontWeight: 600 }}>{card.cat}</span>}
            </div>

            <div
              onClick={() => setFlipped(!flipped)}
              onTouchStart={handleTouchStart}
              onTouchEnd={handleTouchEnd}
              style={{
                perspective: 1000, cursor: "pointer", marginBottom: 16, height: 340,
                userSelect: "none", WebkitTapHighlightColor: "transparent",
              }}
            >
              <div style={{
                position: "relative", width: "100%", height: "100%",
                transformStyle: "preserve-3d", transition: "transform 0.5s",
                transform: flipped ? "rotateY(180deg)" : "rotateY(0deg)",
              }}>
                {/* Front */}
                <div style={{
                  position: "absolute", inset: 0, backfaceVisibility: "hidden",
                  background: "white", borderRadius: 16, border: `3px solid ${colors.border}`,
                  display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center",
                  padding: 24, boxShadow: "0 8px 32px rgba(0,0,0,0.08)",
                }}>
                  <div style={{ fontSize: 32, fontWeight: 700, color: "#1e293b", textAlign: "center", lineHeight: 1.3 }}>
                    {card?.fr}
                  </div>
                  <div style={{ marginTop: 8 }}>
                    <SpeakerBtn text={card?.fr} rate={0.8} size={22} color={colors.text} />
                  </div>
                  <div style={{ marginTop: 8, fontSize: 13, color: "#94a3b8" }}>
                    Tap to reveal
                  </div>
                </div>
                {/* Back */}
                <div style={{
                  position: "absolute", inset: 0, backfaceVisibility: "hidden",
                  transform: "rotateY(180deg)",
                  background: `linear-gradient(145deg, ${colors.bg}, white)`,
                  borderRadius: 16, border: `3px solid ${colors.border}`,
                  display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center",
                  padding: 24, boxShadow: "0 8px 32px rgba(0,0,0,0.08)",
                  overflow: "auto",
                }}>
                  <div style={{ fontSize: 26, fontWeight: 700, color: colors.text, textAlign: "center" }}>
                    {card?.en}
                  </div>
                  <div
                    onClick={(e) => { e.stopPropagation(); setShowTranslation(s => !s); }}
                    style={{
                      marginTop: 18, padding: "12px 16px", background: "rgba(255,255,255,0.7)",
                      borderRadius: 10, borderLeft: `4px solid ${colors.border}`, width: "100%", maxWidth: 400,
                      cursor: "pointer", position: "relative", transition: "background 0.2s",
                    }}
                  >
                    <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                      <SpeakerBtn text={card?.ex} rate={0.85} size={18} color={colors.text} />
                      <div style={{ fontSize: 15, color: "#334155", fontStyle: "italic", lineHeight: 1.5, flex: 1 }}>
                        {card?.ex}
                      </div>
                    </div>
                    <div style={{ fontSize: 11, color: "#94a3b8", marginTop: 5, textAlign: "center" }}>
                      {showTranslation ? "Tap to hide translation" : "Tap for English translation"}
                    </div>
                    {showTranslation && (
                      <div style={{
                        marginTop: 8, padding: "8px 12px",
                        background: "white", borderRadius: 8,
                        border: `1px solid ${colors.border}`,
                        boxShadow: "0 4px 16px rgba(0,0,0,0.1)",
                        fontSize: 14, color: "#475569", lineHeight: 1.5,
                      }}>
                        {card?.exEn}
                      </div>
                    )}
                  </div>
                </div>
              </div>
            </div>

            <div style={{ display: "flex", justifyContent: "center", alignItems: "center", gap: 12 }}>
              <button onClick={prev} disabled={safeIndex === 0}
                style={{
                  width: 48, height: 48, borderRadius: "50%", border: "2px solid #cbd5e1",
                  background: safeIndex === 0 ? "#f1f5f9" : "white", color: safeIndex === 0 ? "#cbd5e1" : "#475569",
                  fontSize: 20, cursor: safeIndex === 0 ? "default" : "pointer", transition: "all 0.2s",
                  display: "flex", alignItems: "center", justifyContent: "center"
                }}>{"\u2190"}</button>

              <button onClick={toggleKnown}
                style={{
                  padding: "10px 20px", borderRadius: 10,
                  border: `2px solid ${known.has(globalIdx) ? "#22c55e" : "#cbd5e1"}`,
                  background: known.has(globalIdx) ? "#dcfce7" : "white",
                  color: known.has(globalIdx) ? "#15803d" : "#64748b",
                  fontSize: 14, fontWeight: 600, cursor: "pointer", transition: "all 0.2s",
                }}>
                {known.has(globalIdx) ? "Known" : "Mark as known"}
              </button>

              <button onClick={next} disabled={safeIndex >= deck.length - 1}
                style={{
                  width: 48, height: 48, borderRadius: "50%", border: "2px solid #cbd5e1",
                  background: safeIndex >= deck.length - 1 ? "#f1f5f9" : "white",
                  color: safeIndex >= deck.length - 1 ? "#cbd5e1" : "#475569",
                  fontSize: 20, cursor: safeIndex >= deck.length - 1 ? "default" : "pointer", transition: "all 0.2s",
                  display: "flex", alignItems: "center", justifyContent: "center"
                }}>{"\u2192"}</button>
            </div>

            <div style={{ textAlign: "center", marginTop: 14, fontSize: 11, color: "#94a3b8" }}>
              Swipe or use arrow keys to navigate, tap card or spacebar to flip
            </div>
          </>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<FlashCards />);
</script>
</body>
</html>
